name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    # The native supervisor's frozen ABI guard is qualified with this toolchain.
    # Newer glibc headers may emit symbols above the unchanged 2.28 floor.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.20.0"
          - "lts/*"
          - "current"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm run check:repository -- . HEAD
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
